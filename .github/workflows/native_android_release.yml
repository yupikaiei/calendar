name: Native Android Release

on:
  push:
    tags:
      - 'native-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build and test
        working-directory: native-android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Prepare artifacts
        run: |
          APK="frelsi-cal-native-${GITHUB_REF_NAME#native-}.apk"
          cp native-android/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          APK="frelsi-cal-native-${TAG#native-}.apk"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete-asset "$TAG" "frelsi-cal-native-${TAG}.apk" --yes || true
            gh release delete-asset "$TAG" "frelsi-cal-native-${TAG}.apk.sha256" --yes || true
            gh release upload "$TAG" "$APK" "$APK.sha256" --clobber
            gh release edit "$TAG" \
              --title "Frelsi Cal Native ${TAG#native-}" \
              --notes-file native-android/RELEASE_NOTES.md \
              --prerelease
          else
            gh release create "$TAG" "$APK" "$APK.sha256" \
              --title "Frelsi Cal Native ${TAG#native-}" \
              --notes-file native-android/RELEASE_NOTES.md \
              --prerelease
          fi
