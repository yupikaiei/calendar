<svg width="1024" height="1024" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Accent gradient: purple → cyan matching app colorScheme -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C63FF"/>
      <stop offset="100%" stop-color="#03DAC6"/>
    </linearGradient>
    <!-- Subtle glow for accent arc -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background: deep navy squircle -->
  <rect width="100" height="100" rx="22" fill="#12121D"/>

  <!-- Calendar arc – subtle quarter-circle accent -->
  <path d="M50 8 A42 42 0 0 1 92 50" stroke="url(#accent)" stroke-width="2.4"
        fill="none" stroke-linecap="round" opacity="0.55" filter="url(#glow)"/>

  <!-- Fehu rune 'F' – modernised, clean geometry, rounded terminals -->
  <g transform="translate(4, 0)">
    <!-- Vertical spine -->
    <path d="M38 18 V82" stroke="white" stroke-width="7" stroke-linecap="round"/>

    <!-- Upper arm – single clean diagonal -->
    <path d="M38 26 L68 12" stroke="white" stroke-width="5" stroke-linecap="round"/>

    <!-- Lower arm – shorter diagonal -->
    <path d="M38 46 L60 34" stroke="white" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Accent tick marks – three clean notches along upper arm -->
    <g stroke="url(#accent)" stroke-width="2.2" stroke-linecap="round">
      <line x1="46" y1="24" x2="49" y2="18"/>
      <line x1="54" y1="21" x2="57" y2="15"/>
      <line x1="62" y1="17" x2="65" y2="11"/>
    </g>
  </g>

  <!-- Subtle dot grid (calendar feel) bottom-right -->
  <g fill="white" opacity="0.12">
    <circle cx="68" cy="68" r="1.2"/>
    <circle cx="76" cy="68" r="1.2"/>
    <circle cx="84" cy="68" r="1.2"/>
    <circle cx="68" cy="76" r="1.2"/>
    <circle cx="76" cy="76" r="1.2"/>
    <circle cx="84" cy="76" r="1.2"/>
    <circle cx="68" cy="84" r="1.2"/>
    <circle cx="76" cy="84" r="1.2"/>
    <circle cx="84" cy="84" r="1.2"/>
  </g>
</svg>
